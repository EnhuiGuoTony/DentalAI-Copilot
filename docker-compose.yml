services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dentalai-postgres
    environment:
      POSTGRES_DB: dentalai
      POSTGRES_USER: dentalai
      POSTGRES_PASSWORD: dentalai
    ports:
      - "5438:5432"
    volumes:
      - dentalai_pg:/var/lib/postgresql/data
      - ./backend/db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dentalai -d dentalai"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: dentalai-api
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    container_name: dentalai-web
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  dentalai_pg:
