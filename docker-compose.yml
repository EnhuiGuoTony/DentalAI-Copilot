services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dentalai-postgres
    environment:
      POSTGRES_DB: dentalai
      POSTGRES_USER: dentalai
      POSTGRES_PASSWORD: dentalai
    ports:
      - "5438:5432"
    volumes:
      - dentalai_pg:/var/lib/postgresql/data
      - ./backend/db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dentalai -d dentalai"]
      interval: 5s
      timeout: 5s
      retries: 10

