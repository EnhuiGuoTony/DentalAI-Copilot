<main class="shell">
  <header class="topbar">
    <h1>DentalAI Copilot</h1>
    <button type="button" (click)="connect()" [disabled]="connecting() || connected()">
      {{ connectionLabel() }}
    </button>
  </header>

  <section class="chat-panel">
    <div class="messages">
      <article *ngFor="let message of messages()" [class.user]="message.role === 'user'">
        <p>{{ message.content }}</p>
      </article>
    </div>

    <form class="composer" (ngSubmit)="send()">
      <textarea
        [ngModel]="input()"
        (ngModelChange)="input.set($event)"
        name="message"
        placeholder="Connect the model to start chatting"
        [disabled]="loading() || !connected()"
      ></textarea>
      <div class="actions">
        <button type="button" (click)="clear()" [disabled]="loading()">Clear</button>
        <button type="submit" [disabled]="loading() || !connected() || !input().trim()">Send</button>
      </div>
    </form>
  </section>
</main>
